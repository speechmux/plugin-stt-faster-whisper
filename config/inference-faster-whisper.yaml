# STT Inference Plugin configuration — faster-whisper engine (CTranslate2, CPU/CUDA)
# Start with: python -m speechmux_plugin_stt.main --config plugin-stt-faster-whisper/config/inference-faster-whisper.yaml

server:
  socket: /tmp/speechmux/stt-faster-whisper.sock  # UDS path this plugin process listens on. Must match plugins.yaml endpoint socket.
  engine: faster_whisper                            # Engine to load (entry-point name from speechmux.stt_engine group).
  log_level: INFO                                   # Logging verbosity: DEBUG | INFO | WARNING | ERROR.
  max_concurrent_sessions: 4                        # Max concurrent Transcribe requests. Tune to GPU concurrency (set to CPU
                                                    # thread count when running on CPU).
  log_transcription_text: true                      # Include recognized text in log output. Set to false to redact
                                                    # text from logs (shows character count instead) for privacy compliance.

engine:
  faster_whisper:
    model: large-v3       # Model size (tiny|base|small|medium|large-v3) or HuggingFace model ID.
    device: auto          # Compute device: auto | cpu | cuda. auto selects CUDA when available, else CPU.
    compute_type: float16 # Quantisation: float16 (GPU, 8+ GB VRAM) | int8_float16 (GPU, 4 GB VRAM) | int8 (CPU).
    language: null        # BCP-47 language code (e.g. "ko"). null = auto-detect per request.
    beam_size: 5          # Beam search width. Higher = more accurate but slower.

  dummy:
    latency_ms: 50        # Artificial inference delay (ms). Simulates GPU latency for load testing.
    text: "hello world"   # Fixed transcript returned for every non-silent audio chunk.
